name: Inspect client archive format

on:
  push:
    paths:
      - ".github/workflows/inspect-client.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect first and last ZIP bytes without downloading 670MB
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, struct
          url = "https://github.com/tcuevhostor-eng/shishani/releases/download/v1.0/client.zip"
          headers={"User-Agent":"SHISHANI-Archive-Inspector"}
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=35) as r:
                  head=r.read(80)
                  print("GET status:",r.status,"type:",r.headers.get("Content-Type"),"content-length:",r.headers.get("Content-Length"))
                  print("First 80 bytes:",head.hex(" "))
                  print("ASCII preview:",repr(head[:45]))
                  if head[:4] == b'PK\\x03\\x04': print("Format: ZIP local header")
                  elif head[:6] == bytes.fromhex("37 7a bc af 27 1c"): print("Format: 7Z (not ZIP)")
                  elif head.startswith(b'Rar!'): print("Format: RAR (not ZIP)")
                  elif head.startswith(b'PK'): print("Format: PK signature")
                  else: print("Format: not recognizable as ZIP/7Z/RAR")
          except Exception as e:
              print("Header ERROR:",repr(e))
          try:
              request=urllib.request.Request(url,headers={**headers,"Range":"bytes=-131072"})
              with urllib.request.urlopen(request,timeout=35) as r:
                  tail=r.read(131072)
                  print("RANGE status:",r.status,"content-range:",r.headers.get("Content-Range"))
                  if r.status==206:
                      idx=tail.rfind(bytes.fromhex("50 4b 05 06"))
                      print("EOCD offset within tail:",idx)
                      if idx>=0 and idx+22<=len(tail):
                          comment=struct.unpack_from("<H",tail,idx+20)[0]
                          print("EOCD comment length:",comment)
                          print("EOCD terminates at last byte:",idx+22+comment==len(tail))
                  else: print("Server ignored suffix range, cannot inspect tail without full download.")
          except Exception as e:
              print("Tail ERROR:",repr(e))
          PY
